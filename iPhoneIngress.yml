apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iphone-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: iphone.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iphone-service
                port:
                  number: 80
